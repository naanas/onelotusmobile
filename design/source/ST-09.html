<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bottom sheet konflik edit</title>
<link rel="stylesheet" href="ol.css">
</head>
<body>
<div class="dc">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>

<div class="scr" style="height: 844px">
  <div class="hd"><span class="ctx">Sesi 6 Okt · Rina Setiawati</span><h1 class="ttl">Detail sesi</h1></div>
  <div class="bd"><div class="card" style="height: 160px"></div><div class="card" style="height: 90px"></div></div>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Konflik perubahan catatan">
    <div class="grab"></div>
    <b class="h">Catatan ini juga diubah di perangkat lain.</b>
    <span class="mini mu">Pilih versi kesimpulan yang dipakai. Versi lainnya tetap tersimpan di riwayat perubahan.</span>
    <label class="card" style="gap: 4px; box-shadow: inset 0 0 0 2px #0277B5, 0 0 0 4px #E3F2FC">
      <div class="row"><b class="mini">Versi HP ini · 09.51</b><input type="radio" name="vr" checked style="width: 20px; height: 20px; accent-color: #0277B5"></div>
      <span class="mini">Lanjut calf raise 3×12, kontrol Kamis.</span>
    </label>
    <label class="card" style="gap: 4px">
      <div class="row"><b class="mini">Versi tablet ruang 2 · 09.53</b><input type="radio" name="vr" style="width: 20px; height: 20px; accent-color: #0277B5"></div>
      <span class="mini">Lanjut calf raise 3×12 + kompres hangat, kontrol Kamis.</span>
    </label>
    <button class="btn">Pakai versi terpilih</button>
  </div>
</div>
</div>
</body>
</html>
