<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>OW-13 Aturan poin dan referral</title>
<link rel="stylesheet" href="ol.css">
</head>
<body>
<div class="dc">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>body{margin:0}</style>

<div class="scr" style="height: 844px">
  <div class="hd" style="padding-top: 12px">
    <a class="icb" href="OW-01.html" aria-label="Kembali" style="margin-left: -10px"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg></a>
    <h1 class="ttl" style="margin-top: 8px">Poin Lotus &amp; referral</h1>
  </div>
  <div class="bd" style="gap: 12px">
    <span class="lbl">Poin</span>
    <div class="card" style="gap: 12px">
      <div class="grid2"><div class="fld"><label for="r1">Poin per Rp10.000</label><div id="r1" class="inp mono">1</div></div><div class="fld"><label for="r2">Nilai 1 poin</label><div id="r2" class="inp mono">Rp100</div></div></div>
      <div class="grid2"><div class="fld"><label for="r3">Maks pakai / transaksi</label><div id="r3" class="inp"><span class="mono">20</span><span class="mu">%</span></div></div><div class="fld"><label for="r4">Masa berlaku</label><div id="r4" class="inp"><span class="mono">12</span><span class="mu">bulan</span></div></div></div>
      <span class="cap">Contoh: bayar Rp450.000 → +45 poin = Rp4.500.</span>
    </div>
    <span class="lbl">Referral</span>
    <div class="card" style="gap: 12px">
      <div class="grid2"><div class="fld"><label for="r5">Hadiah pengundang</label><div id="r5" class="inp mono">200 poin</div></div><div class="fld"><label for="r6">Hadiah teman baru</label><div id="r6" class="inp mono">Rp50.000</div></div></div>
      <div class="fld"><span class="fl">Syarat</span><div class="inp">Transaksi pertama teman lunas</div></div>
    </div>
    <div class="card gold" style="gap: 2px"><span class="cap" style="color: #7A4504">Bulan ini</span><b style="color: #7A4504">38.240 poin beredar · 9 referral berhasil</b></div>
  </div>
  <div class="foot"><button class="btn">Simpan aturan</button></div>
</div>
</div>
</body>
</html>
